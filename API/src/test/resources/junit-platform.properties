# Execução sequencial (não paralela) propositalmente: a API sob teste tem um limite
# de 100 requisições por minuto e é uma base pública compartilhada; rodar em paralelo
# aumentaria o risco de HTTP 429 e de condições de corrida entre massas de dados.
junit.jupiter.execution.parallel.enabled=false
junit.jupiter.testinstance.lifecycle.default=per_method
