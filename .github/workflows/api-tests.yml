name: API Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'API/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'API/**'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  checks: write

jobs:
  api-tests:
    name: Run ServeRest API tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: API

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Executar testes da API
        run: mvn -B clean test

      # Publica os resultados mesmo se algum teste falhar, para não perder evidência do que quebrou.
      - name: Publicar resumo dos testes (JUnit) no resumo do workflow
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados JUnit
          path: API/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Gerar relatório HTML do Allure
        if: always()
        run: mvn -B io.qameta.allure:allure-maven:2.12.0:report

      - name: Publicar relatório Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: API/target/site/allure-maven-plugin
          retention-days: 30

      - name: Publicar resultados do Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: API/target/allure-results
          retention-days: 30

      - name: Publicar relatórios do JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: API/target/surefire-reports
          retention-days: 30
