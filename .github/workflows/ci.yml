name: API Tests - ServeRest /usuarios

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  test:
    name: Executar suíte RestAssured + gerar relatório Allure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Rodar os testes (mvn clean test)
        run: mvn -B clean test

      # Publica os resultados mesmo se algum teste falhar, para não perder evidência do que quebrou.
      - name: Publicar resumo dos testes (JUnit) no resumo do workflow
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados JUnit
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Gerar relatório HTML do Allure
        if: always()
        run: mvn -B io.qameta.allure:allure-maven:2.12.0:report

      - name: Publicar relatório Allure (HTML) como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 30

      - name: Publicar resultados brutos do Allure como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 30

      - name: Publicar relatórios do Surefire (JUnit XML) como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 30
